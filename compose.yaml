name: sea_ice_index_viz

services:
  panel:
    build: .
    environment:
      BOKEH_ALLOW_WS_ORIGIN: '0.0.0.0:7000,localhost:7000,127.0.0.1:7000'
      PORT: '7000'
      LOG_LEVEL: 'debug'
      BOKEH_LOG_LEVEL: 'debug'
      PYTHONUNBUFFERED: 1
      PYTHONPATH: '$${PYTHONPATH}:/bokeh-app'
      APP_ROOT: '/bokeh-app'
      # The NetCDF files live on a read-only file system: HDF5 file locking
      # must be disabled or netCDF4/HDF5 fails to open them.
      HDF5_USE_FILE_LOCKING: 'FALSE'
      # auto = local file system first (storeA, then storeB), then OPeNDAP.
      SII_DATA_SOURCE: 'auto'
      SII_LOCAL_ROOTS: '/lustre/storeA/metproduction:/lustre/storeB/metproduction'
    ports:
      - '7000:7000'
    volumes:
      - ./bokeh-app:/bokeh-app
      - /lustre/storeA/metproduction:/lustre/storeA/metproduction:ro
      - /lustre/storeB/metproduction:/lustre/storeB/metproduction:ro

